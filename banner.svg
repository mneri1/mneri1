        <text x="56" y="20" text-anchor="middle" fill="#e6c98d">15+ YEARS</text>
      </g>
      <g transform="translate(124 0)">
        <rect x="0" y="0" width="140" height="30" rx="15" fill="#967632" fill-opacity="0.12" stroke="#967632" stroke-opacity="0.5"/>
        <text x="70" y="20" text-anchor="middle" fill="#e6c98d">80+ PROJECTS</text>
      </g>
      <g transform="translate(276 0)">
