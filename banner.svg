<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Mikhail Neri, Senior Full Stack Web Developer, The Code Hermit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0e13"/>
      <stop offset="55%" stop-color="#11151d"/>
      <stop offset="100%" stop-color="#0b0e13"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7d5f26"/>
      <stop offset="45%" stop-color="#967632"/>
      <stop offset="100%" stop-color="#e0be7c"/>
    </linearGradient>
    <linearGradient id="goldsoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6c98d"/>
      <stop offset="100%" stop-color="#967632"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#967632" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#967632" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#967632" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#967632" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#967632" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="340" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="16" fill="url(#grid)"/>
  <circle cx="196" cy="170" r="210" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="340" rx="16" fill="none" stroke="#967632" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="0" y="0" width="6" height="340" rx="3" fill="url(#goldsoft)"/>

  <g transform="translate(196 170)">
