    <circle r="78" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-dasharray="330 60" transform="rotate(-35)"/>
    <circle r="62" fill="#0e1218" stroke="#967632" stroke-opacity="0.45" stroke-width="1"/>
    <text x="0" y="14" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" letter-spacing="2" fill="url(#goldsoft)">MN</text>
    <text x="0" y="118" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="12.5" letter-spacing="4.5" fill="#8b949e">CODE HERMIT</text>
  </g>

  <g transform="translate(360 0)">
    <text x="0" y="92" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="14" letter-spacing="2.5" fill="#7d8590">$ whoami</text>
    <text x="0" y="152" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-0.5" fill="#f0f6fc">Mikhail Neri</text>
    <rect x="2" y="172" width="300" height="2" fill="url(#fade)"/>
    <text x="0" y="206" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="3.4" fill="url(#goldsoft)">SENIOR FULL STACK WEB DEVELOPER</text>
    <text x="0" y="240" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="14.5" letter-spacing="0.4" fill="#8b949e">PHP  ·  Laravel  ·  CodeIgniter 4  ·  React 19  ·  TypeScript  ·  WooCommerce  ·  Shopify</text>

    <g transform="translate(0 268)" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="12.5" letter-spacing="1.2">
